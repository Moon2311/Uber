name: ride-hailing

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ridehailing}
      POSTGRES_USER: ${POSTGRES_USER:-ridehailing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 5433 on the host avoids clashing with a locally installed PostgreSQL.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # Live location data is rebuildable (see docs/redis-hot-store.md), so no
    # persistence. noeviction: when memory is full, writes fail loudly (and the app
    # fails over to PostgreSQL) instead of silently dropping index keys.
    command: >
      redis-server --save "" --appendonly no
      --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    ports:
      # 6380 on the host avoids clashing with a locally installed Redis.
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # containers use kafka:9092; the host (tests, local runserver) uses localhost:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (manage.py ensure_kafka_topics) with their
      # own partitions/retention; typos must not silently create topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9094}:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ridehailing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ridehailing}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Deliberately NOT kafka: the API must start and serve without Kafka
      # (events wait in the PostgreSQL outbox).

  # Publishes committed outbox rows to Kafka (single active instance via a
  # PostgreSQL advisory lock; extra replicas idle as hot standbys).
  outbox-relay:
    build: ./backend
    env_file: .env
    command: ["sh", "-c", "python manage.py ensure_kafka_topics --wait 60 && python manage.py run_outbox_relay"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ridehailing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ridehailing}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      backend:
        condition: service_started  # runs migrations
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # WebSocket servers (ASGI / Daphne). Two instances share state only through the
  # Redis channel layer, demonstrating horizontal scaling of real-time delivery.
  realtime-1: &realtime
    build: ./backend
    env_file: .env
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "--ping-interval", "20", "--ping-timeout", "30", "config.asgi:application"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ridehailing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ridehailing}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CHANNEL_LAYER_BACKEND: redis
    ports:
      - "8001:8001"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  realtime-2:
    <<: *realtime
    command: ["daphne", "-b", "0.0.0.0", "-p", "8002", "--ping-interval", "20", "--ping-timeout", "30", "config.asgi:application"]
    ports:
      - "8002:8002"

  # Matching engine worker (safe to scale: SKIP LOCKED + leases + DB constraints).
  matching-worker:
    build: ./backend
    env_file: .env
    command: ["python", "manage.py", "run_matching_worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ridehailing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ridehailing}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      backend:
        condition: service_started  # runs migrations
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Example downstream consumer (analytics read models).
  consumer-analytics:
    build: ./backend
    env_file: .env
    command: ["sh", "-c", "python manage.py ensure_kafka_topics --wait 60 && python manage.py run_event_consumer analytics"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ridehailing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ridehailing}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      backend:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
