# LOCAL DEVELOPMENT stack. Production runs on Kubernetes (deploy/k8s) with managed
# PostgreSQL / Redis / Kafka; see docs/deployment.md. Host ports bind to 127.0.0.1.
name: ride-hailing

x-app: &app
  build:
    context: ./backend
    args:
      APP_RELEASE: ${APP_RELEASE:-local}
  image: ride-hailing-backend:${APP_RELEASE:-local}
  env_file: .env
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-ridehailing}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ridehailing}
    REDIS_URL: redis://redis:6379/0
    CACHE_URL: redis://redis:6379/1
    CACHE_BACKEND: redis
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    CHANNEL_LAYER_BACKEND: redis
    METRICS_BACKEND: apps.common.metrics.PrometheusMetrics
    METRICS_PORT: "9100"
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend,realtime-1,realtime-2
  restart: unless-stopped
  depends_on: &app-deps
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ridehailing}
      POSTGRES_USER: ${POSTGRES_USER:-ridehailing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 5433 on the host avoids clashing with a locally installed PostgreSQL.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    # Live location data is rebuildable (see docs/redis-hot-store.md), so no
    # persistence. noeviction: when memory is full, writes fail loudly (and the app
    # fails over to PostgreSQL) instead of silently dropping index keys.
    command: >
      redis-server --save "" --appendonly no
      --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy noeviction
    ports:
      # 6380 on the host avoids clashing with a locally installed Redis.
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # containers use kafka:9092; the host (tests, local runserver) uses localhost:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (manage.py ensure_kafka_topics) with their
      # own partitions/retention; typos must not silently create topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9094}:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # One-shot jobs: schema first, topics second. App services wait for `migrate`.
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  kafka-init:
    <<: *app
    command: ["ensure_kafka_topics", "--wait", "60"]
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy

  backend:
    <<: *app
    command: ["web"]
    environment:
      <<: *app-env
      METRICS_PORT: "0"  # gunicorn serves /metrics itself (multiprocess)
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    ports:
      - "127.0.0.1:8000:8000"
    # Deliberately NOT kafka: the API must start and serve without Kafka.

  # WebSocket servers: two instances share state only through the Redis channel layer.
  realtime-1: &realtime
    <<: *app
    command: ["asgi"]
    # Measured: the default soft limit (1024 fds) caps a server at ~1000 sockets.
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    environment:
      <<: *app-env
      PORT: "8001"
      METRICS_PORT: "0"
    ports:
      - "127.0.0.1:8001:8001"

  realtime-2:
    <<: *realtime
    environment:
      <<: *app-env
      PORT: "8002"
      METRICS_PORT: "0"
    ports:
      - "127.0.0.1:8002:8002"

  # Single active relay (advisory lock); extra replicas idle as hot standbys.
  outbox-relay:
    <<: *app
    command: ["run_outbox_relay"]
    depends_on:
      <<: *app-deps
      kafka-init:
        condition: service_completed_successfully

  matching-worker:
    <<: *app
    command: ["run_matching_worker"]

  # Illustrative surge policy: see docs/pricing-payments.md (legal notice).
  surge-updater:
    <<: *app
    command: ["update_surge"]

  payments-worker:
    <<: *app
    command: ["run_payments_worker"]

  notification-worker:
    <<: *app
    command: ["run_notification_worker"]

  # Periodic maintenance (expire stale drivers, reconcile, prune...): one active.
  scheduler:
    <<: *app
    command: ["run_scheduler"]

  # System gauges for Prometheus (freshness, backlogs, lag, DB health).
  ops-monitor:
    <<: *app
    command: ["run_ops_monitor"]

  consumer-analytics: &consumer
    <<: *app
    command: ["run_event_consumer", "analytics"]
    depends_on:
      <<: *app-deps
      kafka-init:
        condition: service_completed_successfully

  consumer-fraud:
    <<: *consumer
    command: ["run_event_consumer", "fraud"]

  consumer-notifications:
    <<: *consumer
    command: ["run_event_consumer", "notifications"]

  # `docker compose --profile observability up -d` -> http://localhost:9090
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  pgdata:
  kafkadata:
