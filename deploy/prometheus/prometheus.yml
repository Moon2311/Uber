# Local (docker compose --profile observability). In Kubernetes the same alert
# rules are loaded through deploy/k8s/base/monitoring.yaml.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: ["alerts.yml"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs: [{targets: ["backend:8000"]}]
  - job_name: realtime
    metrics_path: /metrics
    static_configs: [{targets: ["realtime-1:8001", "realtime-2:8002"]}]
  - job_name: workers
    static_configs:
      - targets:
          - outbox-relay:9100
          - matching-worker:9100
          - surge-updater:9100
          - payments-worker:9100
          - notification-worker:9100
          - scheduler:9100
          - ops-monitor:9100
          - consumer-analytics:9100
          - consumer-fraud:9100
          - consumer-notifications:9100
