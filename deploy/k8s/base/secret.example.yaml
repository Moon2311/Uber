# EXAMPLE ONLY - not part of kustomization.yaml. Never commit real values.
# Create the real secret from your secret manager, e.g.
#   kubectl -n ride-hailing create secret generic app-secrets --from-env-file=prod.secrets.env
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "<50+ random chars>"
  JWT_SIGNING_KEY: "<different 50+ random chars>"
  DJANGO_ALLOWED_HOSTS: "api.example.com,ws.example.com"
  CORS_ALLOWED_ORIGINS: "https://app.example.com"
  CSRF_TRUSTED_ORIGINS: "https://app.example.com"
  REALTIME_ALLOWED_ORIGINS: "https://app.example.com"
  ADMIN_URL_PATH: "<random-path>/"
  DATABASE_URL: "postgres://app:<pw>@<managed-pg-host>:5432/ridehailing?sslmode=verify-full"
  REDIS_URL: "rediss://:<pw>@<managed-redis-host>:6380/0"
  CACHE_URL: "rediss://:<pw>@<managed-redis-host>:6380/1"
  KAFKA_BOOTSTRAP_SERVERS: "<broker-1>:9093,<broker-2>:9093,<broker-3>:9093"
  METRICS_TOKEN: "<random>"
  PAYMENTS_WEBHOOK_SECRETS: "whsec_<current>,whsec_<previous>"
  SENTRY_DSN: "https://<key>@<sentry-host>/<project>"
