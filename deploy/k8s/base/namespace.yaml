apiVersion: v1
kind: Namespace
metadata:
  name: ride-hailing
  labels:
    # Enforce the "restricted" Pod Security Standard: non-root, no privilege
    # escalation, seccomp, dropped capabilities (every pod here complies).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ride-hailing
automountServiceAccountToken: false  # the app never talks to the Kubernetes API
