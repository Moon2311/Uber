# Background workers. All are safe to run with >1 replica (locks / SKIP LOCKED / leases);
# liveness = the worker loop heartbeat (healthcheck.py), not just a running process.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  labels: &id001
    app.kubernetes.io/name: outbox-relay
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: ride-hailing
  annotations:
    ride-hailing/notes: single ACTIVE relay (advisory lock); 2nd is a hot standby
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: *id001
      annotations:
        prometheus.io/scrape: 'true'
    spec:
      serviceAccountName: ride-hailing
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
      - name: outbox-relay
        image: ghcr.io/example/ride-hailing-backend
        imagePullPolicy: IfNotPresent
        args:
        - run_outbox_relay
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: METRICS_PORT
          value: '9100'
        resources:
          requests:
            cpu: 100m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 384Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        ports:
        - name: metrics
          containerPort: 9100
        livenessProbe:
          exec:
            command:
            - python
            - /app/healthcheck.py
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
          initialDelaySeconds: 30
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: outbox-relay
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: outbox-relay
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-relay
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: outbox-relay
  maxUnavailable: 1
---
